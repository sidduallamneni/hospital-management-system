{% extends "base.html" %}{% block content %}
<h1>Billing</h1>
<form method="post" class="grid">
  <select name="patient_id" required><option value="">Select patient</option>{% for p in patients %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select>
  <input name="description" placeholder="Description (consultation, lab, medicines)">
  <input name="amount" type="number" step="0.01" min="0" placeholder="Amount" required>
  <button>Generate bill</button>
</form>
<table><tr><th>ID</th><th>Patient</th><th>Description</th><th>Amount</th><th>Date</th><th>Status</th><th></th></tr>
{% for r in rows %}<tr><td>{{r.id}}</td><td>{{r.patient}}</td><td>{{r.description}}</td><td>₹{{r.amount}}</td><td>{{r.created_at}}</td>
<td><span class="badge {{ r.status|lower }}">{{r.status}}</span></td>
<td>{% if r.status=='Unpaid' %}<form method="post" action="{{ url_for('pay_bill', bid=r.id) }}"><button>Mark paid</button></form>{% endif %}</td></tr>
{% else %}<tr><td colspan="7">No bills yet.</td></tr>{% endfor %}</table>
{% endblock %}
