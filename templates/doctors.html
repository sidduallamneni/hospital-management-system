{% extends "base.html" %}{% block content %}
<h1>Doctors</h1>
<form method="post" class="grid">
  <input name="name" placeholder="Doctor name *" required>
  <input name="specialization" placeholder="Specialization">
  <input name="phone" placeholder="Phone">
  <input name="fee" type="number" step="0.01" min="0" placeholder="Consultation fee">
  <button>Add doctor</button>
</form>
<table><tr><th>ID</th><th>Name</th><th>Specialization</th><th>Phone</th><th>Fee</th><th></th></tr>
{% for r in rows %}<tr><td>{{r.id}}</td><td>{{r.name}}</td><td>{{r.specialization}}</td><td>{{r.phone}}</td><td>₹{{r.fee}}</td>
<td><form method="post" action="{{ url_for('delete_doctor', did=r.id) }}" onsubmit="return confirm('Delete doctor?')"><button class="danger">Delete</button></form></td></tr>
{% else %}<tr><td colspan="6">No doctors yet.</td></tr>{% endfor %}</table>
{% endblock %}
