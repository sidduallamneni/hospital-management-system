<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Hospital Management System{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head><body>
<nav>
  <span class="brand">🏥 CloudCare HMS</span>
  <a href="{{ url_for('index') }}">Dashboard</a>
  <a href="{{ url_for('patients') }}">Patients</a>
  <a href="{{ url_for('doctors') }}">Doctors</a>
  <a href="{{ url_for('appointments') }}">Appointments</a>
  <a href="{{ url_for('billing') }}">Billing</a>
</nav>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>Cloud Computing Lab Project &middot; Hospital Management System</footer>
</body></html>
